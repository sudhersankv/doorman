app = "doorman-trailhead"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  MONGODB_DB = "doorman"
  SITE_ID = "trailhead"
  RATE_LIMIT_PER_IP = "120"
  RATE_LIMIT_GLOBAL = "1200"
  LLM_MAX_USD = "10"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
